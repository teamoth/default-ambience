# Builds a test version of the Android app whenever the app changes,
# and puts the installable file (APK) on the "Android test build" release.
name: Android test build
on:
  push:
    branches: [main]
    paths: [index.html, macro.wasm, macro-worklet.js, icons/**, scripts/**, package.json, capacitor.config.json, .github/workflows/android.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Prepare the app's web files
        run: python3 scripts/make-www.py
      - name: Create the Android project
        run: npx cap add android && npx cap sync android
      - name: Icons and version
        id: ver
        run: |
          pip install --quiet pillow
          python3 scripts/android-icons.py
          python3 scripts/android-version.py
      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Publish to the "Android test build" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=DefaultAmbience-${{ steps.ver.outputs.name }}-test.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          gh release view android-test >/dev/null 2>&1 || gh release create android-test --prerelease --title "Android test build" --notes "Test builds of the Android app. Download the .apk on your phone to install it."
          # keep only the newest APK on the release
          for a in $(gh release view android-test --json assets -q '.assets[].name'); do gh release delete-asset android-test "$a" -y; done
          gh release upload android-test "$APK"
          gh release edit android-test --notes "Newest test build: version ${{ steps.ver.outputs.name }} (from commit ${GITHUB_SHA::7}). On your Android phone, download the .apk below and open it to install. You may need to allow installing apps from your browser."
